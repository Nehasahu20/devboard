apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: devboard-alerts
  namespace: monitoring
  labels:
    release: prometheus

spec:
  groups:
    - name: devboard.rules

      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="devboard"}[5m]) > 0
          for: 1m

          labels:
            severity: critical

          annotations:
            summary: "Pod {{ $labels.pod }} crash looping"
            description: "Pod is restarting frequently - rollback needed"

        - alert: DeploymentReplicasUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="devboard"} > 0
          for: 2m

          labels:
            severity: warning

          annotations:
            summary: "Deployment {{ $labels.deployment }} has unavailable replicas"

        - alert: BackendHighErrorRate
          expr: rate(kube_pod_container_status_restarts_total{namespace="devboard", container="devboard-backend"}[5m]) > 0
          for: 1m

          labels:
            severity: critical

          annotations:
            summary: "Backend error rate high - triggering rollback"
