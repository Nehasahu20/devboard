name: CI/CD Pipeline

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - frontend
          - backend
      max-parallel: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push to ECR
        env:
          ECR_REGISTRY: 651023585812.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/devboard-${{ matrix.service }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/devboard-${{ matrix.service }}:latest \
            ./${{ matrix.service }}

          docker push $ECR_REGISTRY/devboard-${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/devboard-${{ matrix.service }}:latest

      - name: Update Kubernetes Manifest
        env:
          ECR_REGISTRY: 651023585812.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: $ECR_REGISTRY/devboard-${{ matrix.service }}:.*|image: $ECR_REGISTRY/devboard-${{ matrix.service }}:$IMAGE_TAG|g" \
            k8s/${{ matrix.service }}-deployment.yml

      - name: Commit Updated Manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git pull --rebase origin master

          git add k8s/${{ matrix.service }}-deployment.yml

          git diff --staged --quiet || \
          git commit -m "ci: update ${{ matrix.service }} image to ${{ github.sha }}"

          git push
