name: CI/CD Pipeline

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - frontend
          - backend
      max-parallel: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push to ECR
        env:
          ECR_REGISTRY: 651023585812.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/devboard-${{ matrix.service }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/devboard-${{ matrix.service }}:latest \
            ./${{ matrix.service }}

          docker push $ECR_REGISTRY/devboard-${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/devboard-${{ matrix.service }}:latest

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 651023585812.dkr.ecr.ap-south-1.amazonaws.com/devboard-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-report
          path: trivy-${{ matrix.service }}.sarif

      - name: Update and Commit Manifest
        env:
          ECR_REGISTRY: 651023585812.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          sed -i "s|image: $ECR_REGISTRY/devboard-${{ matrix.service }}:.*|image: $ECR_REGISTRY/devboard-${{ matrix.service }}:$IMAGE_TAG|g" \
            k8s/${{ matrix.service }}-deployment.yml

          git add k8s/${{ matrix.service }}-deployment.yml

          if git diff --staged --quiet; then
            echo "No manifest changes, skipping commit"
            exit 0
          fi

          git commit -m "ci: update ${{ matrix.service }} image to $IMAGE_TAG"

          git pull --rebase origin master
          git push origin master
